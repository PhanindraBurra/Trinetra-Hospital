<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none">
  <defs>
    <linearGradient id="bg_hosp" x1="0" y1="0" x2="600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="420" fill="url(#bg_hosp)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="0" y1="280" x2="600" y2="280" />
    <line x1="0" y1="350" x2="600" y2="350" />
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
  </g>
  
  <!-- Abstract Graphic Visual -->
  <circle cx="300" cy="180" r="90" fill="#FFFFFF" fill-opacity="0.1" />
  <circle cx="300" cy="180" r="60" fill="#FFFFFF" fill-opacity="0.15" />
  
  <!-- Medical Cross Badge -->
  <g transform="translate(275, 155)">
    <rect x="20" y="0" width="10" height="50" rx="5" fill="#FFFFFF" />
    <rect x="0" y="20" width="50" height="10" rx="5" fill="#FFFFFF" />
  </g>
  
  <!-- Hospital Facility Tag -->
  <rect x="40" y="310" width="520" height="75" rx="12" fill="#FFFFFF" fill-opacity="0.95" />
  <text x="60" y="342" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="800" fill="#0F172A">
    Specialist Outpatient Clinic
  </text>
  <text x="60" y="367" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#475569">
    Patient Consultation & Examination Chambers
  </text>
</svg>
